<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/main.css" />

    <title>Schedule | Barber Shop</title>
  </head>

  <body>
    <nav class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a href="clients.html">Clients</a>
      <a href="services.html">Services</a>
      <a href="professionals.html">Professionals</a>

      <button onclick="exportBackup()">Backup</button>
      <div id="backup-message" class="message-box">
        <span>Do you want to create a backup?</span>
        <button type="button" onclick="confirmBackup()">Backup</button>
        <button type="button" onclick="closeBackupMessage()">Cancel</button>
      </div>

      <button onclick="logout()">Logout</button>
      <div id="logout-message" class="message-box">
        <span>Are you sure you want to logout?</span>
        <button type="button" onclick="confirmLogout()">Logout</button>
        <button type="button" onclick="closeLogoutMessage()">Cancel</button>
      </div>
    </nav>

    <div class="page">
      <header class="top-bar">
        <h2>Schedule</h2>
      </header>

      <main class="content">
        <div class="card">
          <h3>Create Appointment</h3>

          <form id="schedule-form">
            <select id="schedule-client" required>
              <option value="">Select Client</option>
            </select>

            <select id="schedule-service" required>
              <option value="">Select Service</option>
            </select>

            <select id="schedule-professional" required>
              <option value="">Select Professional</option>
            </select>

            <label for="schedule-date">Start Time</label>
            <input type="datetime-local" id="schedule-date" required />

            <label for="schedule-end-date">End Time</label>
            <input type="datetime-local" id="schedule-end-date" readonly />

            <label for="schedule-duration">Duration (min)</label>
            <input
              type="number"
              id="schedule-duration"
              min="1"
              placeholder="Duration (min)"
              required
            />

            <label for="schedule-status">Status</label>
            <select id="schedule-status">
              <option value="Scheduled">Scheduled</option>
              <option value="Completed">Completed</option>
              <option value="Cancelled">Cancelled</option>
              <option value="No-show">No-show</option>
            </select>

            <div id="schedule-message" class="message-box">
              <span
                >This professional already has an appointment during this
                time.</span
              >
              <button type="button" onclick="closeScheduleMessage()">OK</button>
            </div>

            <button type="submit">Save Appointment</button>
          </form>
        </div>

        <hr />

        <!-- Campo de busca -->
        <input
          type="text"
          id="appointment-search"
          placeholder="Search appointments..."
        />

        <div class="card">
          <h3>Appointments List</h3>

          <select id="professional-filter">
            <option value="">All Professionals</option>
          </select>

          <button id="show-all-appointments">Show All</button>

          <table id="schedule-table">
            <thead>
              <tr>
                <th>Client</th>
                <th>Service</th>
                <th>Professional</th>
                <th>Price</th>
                <th>Status</th>
                <th>Date & Time</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </main>
    </div>

    <script src="js/schedule.js"></script>
    <script src="js/backup.js"></script>
    <script src="js/logout.js"></script>
  </body>
</html>
