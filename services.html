<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Services | Salon Management System</title>

    <!-- Load the styles used by the Services page. -->
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body>
    <nav class="menu">
      <!-- Salon Pro brand header. -->
      <div class="sidebar-brand">
        <i class="fa-solid fa-scissors"></i>

        <div class="brand-text">
          <h2>Salon <span>Pro</span></h2>
          <p>Management System</p>
        </div>
      </div>

      <a href="dashboard.html">
        <i class="fa-solid fa-house"></i>
        Dashboard
      </a>

      <a href="clients.html">
        <i class="fa-solid fa-users"></i>
        Clients
      </a>

      <a href="schedule.html">
        <i class="fa-solid fa-calendar-check"></i>
        Schedule
      </a>

      <a href="professionals.html">
        <i class="fa-solid fa-user-tie"></i>
        Professionals
      </a>

      <!-- Backup confirmation message. -->
      <button onclick="exportBackup()">Backup</button>

      <div id="backup-message" class="message-box">
        <span>Do you want to create a backup?</span>
        <button type="button" onclick="confirmBackup()">Backup</button>
        <button type="button" onclick="closeBackupMessage()">Cancel</button>
      </div>

      <!-- Logout confirmation message. -->
      <button onclick="logout()">Logout</button>

      <div id="logout-message" class="message-box">
        <span>Are you sure you want to logout?</span>
        <button type="button" onclick="confirmLogout()">Logout</button>
        <button type="button" onclick="closeLogoutMessage()">Cancel</button>
      </div>

      <!-- Service deletion confirmation message. -->
      <div id="delete-service-message" class="message-box">
        <span>Are you sure you want to delete this service?</span>
        <button type="button" onclick="confirmDeleteService()">Delete</button>
        <button type="button" onclick="closeDeleteServiceMessage()">
          Cancel
        </button>
      </div>
    </nav>

    <div class="page">
      <header class="top-bar">
        <h2>Services</h2>
      </header>

      <main class="content">
        <!-- Form used to add or edit services. -->
        <h3>Add / Edit Service</h3>

        <form id="service-form">
          <input type="hidden" id="service-index" />

          <input
            type="text"
            id="service-name"
            placeholder="Service Name"
            required
          />

          <input
            type="number"
            id="service-price"
            min="0"
            placeholder="Price"
            required
          />

          <input
            type="number"
            id="service-duration"
            min="1"
            placeholder="Duration (minutes)"
            required
          />

          <button type="submit">Save Service</button>
        </form>

        <hr />

        <!-- Search services by name. -->
        <input
          type="text"
          id="service-search"
          placeholder="Search services..."
        />

        <h3>Services List</h3>

        <!-- Service data is loaded dynamically by services.js. -->
        <table id="services-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Price</th>
              <th>Duration</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody></tbody>
        </table>
      </main>
    </div>

    <!-- Load service functionality and shared actions. -->
    <script src="js/services.js"></script>
    <script src="js/backup.js"></script>
    <script src="js/logout.js"></script>
  </body>
</html>
