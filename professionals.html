<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Professionals | Salon Management System</title>

    <!-- Load the styles used by the Professionals page. -->
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body>
    <nav class="menu">
      <a href="dashboard.html">
        <i class="fa-solid fa-house"></i>
        Dashboard
      </a>

      <a href="clients.html">
        <i class="fa-solid fa-users"></i>
        Clients
      </a>

      <a href="services.html">
        <i class="fa-solid fa-scissors"></i>
        Services
      </a>

      <a href="schedule.html">
        <i class="fa-solid fa-calendar-check"></i>
        Schedule
      </a>

      <!-- Backup confirmation message. -->
      <button onclick="exportBackup()">Backup</button>

      <div id="backup-message" class="message-box">
        <span>Do you want to create a backup?</span>
        <button type="button" onclick="confirmBackup()">Backup</button>
        <button type="button" onclick="closeBackupMessage()">Cancel</button>
      </div>

      <!-- Logout confirmation message. -->
      <button onclick="logout()">Logout</button>

      <div id="logout-message" class="message-box">
        <span>Are you sure you want to logout?</span>
        <button type="button" onclick="confirmLogout()">Logout</button>
        <button type="button" onclick="closeLogoutMessage()">Cancel</button>
      </div>

      <!-- Professional deletion confirmation message. -->
      <div id="delete-professional-message" class="message-box">
        <span>Are you sure you want to delete this professional?</span>

        <button type="button" onclick="confirmDeleteProfessional()">
          Delete
        </button>

        <button type="button" onclick="closeDeleteProfessionalMessage()">
          Cancel
        </button>
      </div>
    </nav>

    <div class="page">
      <header class="top-bar">
        <h2>Professionals</h2>
      </header>

      <main class="content">
        <!-- Form used to add or edit professionals. -->
        <h3>Add / Edit Professional</h3>

        <form id="professional-form">
          <input type="hidden" id="professional-index" />

          <input
            type="text"
            id="professional-name"
            placeholder="Name"
            required
          />

          <input
            type="text"
            id="professional-role"
            placeholder="Role (Stylist, Barber...)"
            required
          />

          <button type="submit">Save Professional</button>
        </form>

        <hr />

        <!-- Professional data is loaded dynamically by professionals.js. -->
        <table id="professionals-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Role</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody></tbody>
        </table>
      </main>
    </div>

    <!-- Load professional functionality and shared actions. -->
    <script src="js/professionals.js"></script>
    <script src="js/backup.js"></script>
    <script src="js/logout.js"></script>
  </body>
</html>
