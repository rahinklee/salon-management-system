<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/main.css" />
    <title>Professionals | Baber Shop</title>
  </head>
  <body>
    <nav class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a href="clients.html">Clients</a>
      <a href="services.html">Services</a>
      <a href="schedule.html">Schedule</a>

      <button onclick="exportBackup()">Backup</button>
      <div id="backup-message" class="message-box">
        <span>Do you want to create a backup?</span>
        <button type="button" onclick="confirmBackup()">Backup</button>
        <button type="button" onclick="closeBackupMessage()">Cancel</button>
      </div>

      <button onclick="logout()">Logout</button>
      <div id="logout-message" class="message-box">
        <span>Are you sure you want to logout?</span>
        <button type="button" onclick="confirmLogout()">Logout</button>
        <button type="button" onclick="closeLogoutMessage()">Cancel</button>
      </div>
    </nav>

    <div class="page">
      <header class="top-bar">
        <h2>Professionals</h2>
      </header>

      <main class="content">
        <h3>Add / Edit Professional</h3>

        <form id="professional-form">
          <input type="hidden" id="professional-index" />

          <input
            type="text"
            id="professional-name"
            placeholder="Name"
            required
          />
          <input
            type="text"
            id="professional-role"
            placeholder="Role (Barber, Stylist...)"
            required
          />

          <button type="submit">Save Professional</button>
        </form>

        <hr />

        <table id="professionals-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Role</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- Load Professionals -->
          </tbody>
        </table>
      </main>
    </div>

    <script src="js/professionals.js"></script>
    <script src="js/backup.js"></script>
    <script src="js/logout.js"></script>
  </body>
</html>
