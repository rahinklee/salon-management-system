<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | BSS</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <nav class="menu">
      <a href="clients.html">Clients</a>
      <a href="services.html">Services</a>
      <a href="schedule.html">Schedule</a>
      <a href="professionals.html">Professionals</a>

      <button onclick="exportBackup()">Backup</button>
      <div id="backup-message" class="message-box">
        <span>Do you want to create a backup?</span>
        <button type="button" onclick="confirmBackup()">Backup</button>
        <button type="button" onclick="closeBackupMessage()">Cancel</button>
      </div>

      <button onclick="logout()">Logout</button>
      <div id="logout-message" class="message-box">
        <span>Are you sure you want to logout?</span>
        <button type="button" onclick="confirmLogout()">Logout</button>
        <button type="button" onclick="closeLogoutMessage()">Cancel</button>
      </div>
    </nav>

    <div class="page">
      <header class="top-bar">
        <h2>Dashboard</h2>
      </header>

      <main class="content">
        <div class="stats-container">
          <div class="stat-card">
            <i class="fa-solid fa-users stat-icon"></i>
            <h3>Clients</h3>
            <p id="total-clients">0</p>
          </div>

          <div class="stat-card">
            <i class="fa-solid fa-scissors stat-icon"></i>
            <h3>Services</h3>
            <p id="total-services">0</p>
          </div>

          <div class="stat-card">
            <i class="fa-solid fa-calendar-check stat-icon"></i>
            <h3>Appointments</h3>
            <p id="total-appointments">0</p>
          </div>

          <div class="stat-card">
            <i class="fa-solid fa-dollar-sign stat-icon"></i>
            <h3>Revenue</h3>
            <p id="total-revenue">$0.00</p>
          </div>
        </div>

        <h2>Today's Appointments</h2>

        <table id="today-appointments">
          <thead>
            <tr>
              <th>Client</th>
              <th>Service</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

        <h2>Upcoming Appointments</h2>

        <table id="upcoming-appointments">
          <thead>
            <tr>
              <th>Date</th>
              <th>Time</th>
              <th>Client</th>
              <th>Service</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </main>
    </div>
    <script src="js/auth-guard.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/backup.js"></script>
    <script src="js/logout.js"></script>
  </body>
</html>
